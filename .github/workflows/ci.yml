name: SIDECI CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-hygiene:
    name: Secret & PII Tracked-File Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no forbidden credential or raw dump files are tracked
        run: |
          FORBIDDEN=$(git ls-files | grep -E '(credentials\.env|service-account.*\.json|\.jks$|\.pem$|\.key$|db_sideci\.sql|Data_Kependudukan.*\.xlsx)' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: Forbidden secret or citizen PII file tracked in Git:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "OK: Zero forbidden credential or PII files tracked."

  backend-checks:
    name: Backend (Golang Vet & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum
      - name: Go Format Check
        run: test -z "$(gofmt -l .)"
      - name: Go Vet
        run: go vet ./...
      - name: Go Test & Build
        run: |
          go test -v ./...
          go build -o bin/sideci-api ./cmd/api

  frontend-checks:
    name: Frontend (Next.js Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: TypeScript Typecheck
        run: npm run typecheck
      - name: Next.js Production Build
        run: npm run build
