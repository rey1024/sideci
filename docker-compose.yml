services:
  postgres:
    image: postgres:16-alpine
    container_name: sideci-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sideci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sideci_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-sideci_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sideci_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sideci} -d ${POSTGRES_DB:-sideci_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sideci-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-sideci}:${POSTGRES_PASSWORD:-sideci_local_dev_only}@postgres:5432/${POSTGRES_DB:-sideci_dev}?sslmode=disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-local-dev-minimum-32-chars}
      ALLOWED_ORIGINS: http://localhost:3000,http://ringdikit.localhost:3000
      MIGRATIONS_DIR: /app/migrations
      AUTO_MIGRATE: "true"
      BOOTSTRAP_SUPERADMIN_USERNAME: ${BOOTSTRAP_SUPERADMIN_USERNAME:-}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sideci-frontend-dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
      INTERNAL_API_BASE_URL: http://backend:8080/api/v1
      NEXT_PUBLIC_DEFAULT_VILLAGE_SLUG: ${NEXT_PUBLIC_DEFAULT_VILLAGE_SLUG:-ringdikit}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  sideci_pgdata:
